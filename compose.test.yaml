services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lapin_test
      POSTGRES_USER: lapin
      POSTGRES_PASSWORD: lapin
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapin -d lapin_test"]
      interval: 2s
      timeout: 3s
      retries: 20
