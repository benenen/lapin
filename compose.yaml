services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lapin
      POSTGRES_USER: lapin
      POSTGRES_PASSWORD: lapin
    volumes:
      - lapin-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapin -d lapin"]
      interval: 3s
      timeout: 3s
      retries: 20

  lapin:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://lapin:lapin@postgres:5432/lapin?sslmode=disable
      HTTP_ADDR: :8080
      SECURE_COOKIES: "false"
      HASHID_SALT: ${HASHID_SALT:-lapin-development-salt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  lapin-postgres:
